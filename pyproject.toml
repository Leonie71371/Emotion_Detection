[project]
name = "emotion-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "leonieallgaier", email = "allgaier.leonie@web.de" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets<4",
    "numpy<2",
    "pandas>=2.2,<3",
    "torch==2.2.2",
    "transformers>=4.40,<4.50",
]

[project.scripts]
emotion-detection = "emotion_detection:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
